name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: wiliwili Android (arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Build libromfs-generator (host tool)
        run: |
          cd library/borealis
          bash build_libromfs_generator.sh
          cp libromfs-generator ../../libromfs-generator

      - name: Prepare prebuilt libmpv
        run: bash .ci/prepare_mpv.sh

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android-project/app/wiliwili.jks -storetype JKS \
            -storepass wiliwili -keypass wiliwili \
            -alias wiliwili -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=wiliwili-android, OU=wiliwili, O=wiliwili, L=NA, S=NA, C=CN"

      - name: Build release APK
        working-directory: android-project
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-android-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
